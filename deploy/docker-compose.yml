# ============================================================
#  chunk-english · 生产编排（已拍板方案）
#  用途：1Panel → 容器 → 编排 → 粘贴本文件
#
#  依赖（均不由本编排创建）：
#   - PostgreSQL：🔴 用 1Panel 自带的 PG 容器（如 1Panel-postgresql-Htbt），
#     先在 1Panel → 数据库 建 chunk_english 库；app 加入 1panel-network 容器名直连
#   - MinIO：1Panel 应用商店安装的独立容器（容器名 1Panel-minio-xxxx），
#     同样走 1panel-network 直连
#  本文件只跑应用本身（Next.js standalone）。
# ============================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: chunk-english:${IMAGE_TAG:-latest}
    container_name: chunk-english-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # ⚠️ 只绑本机，公网入口永远只有 Nginx
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chunk-net
      - 1panel-network      # 与 1Panel 装的 postgresql / minio 互通，容器名可直连
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chunk-net:
    driver: bridge
  # 1Panel 自带 PG 与应用商店 MinIO 都在这个网络里，容器名直连
  # 名字以 `docker network ls` 实际输出为准
  1panel-network:
    external: true
