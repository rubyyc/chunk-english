<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 / 注册 ｜ 苑说英语</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="index.html"><img src="assets/logo/logo.svg" alt="苑说英语"></a>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="chunk.html">语块英语</a>
      <a href="words.html">词库</a>
      <a href="pricing.html">会员</a>
    </nav>
    <div class="spacer"></div>
    <a class="btn btn-ghost btn-sm" href="login.html">登录 / 注册</a>
  </div>
</header>

<main class="page">
  <div class="container">
    <div class="auth-wrap">
      <div class="card" style="padding:32px 30px 30px">
        <div class="auth-tabs">
          <button class="on">登录</button>
          <button data-toast="切换到注册（演示）">注册</button>
        </div>

        <div class="field">
          <label>邮箱</label>
          <input type="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label>密码</label>
          <input type="password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary btn-block" data-toast="登录（演示）：成功后跳转「我的学习」">登 录</button>
        <p class="auth-alt"><a href="#" data-toast="发送重置邮件（演示）" style="color:var(--accent)">忘记密码？</a></p>

        <div class="auth-divide">或</div>

        <button class="wechat-btn" data-toast="微信扫码登录（二期：Auth.js + 微信开放平台）">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8.7 3C4.9 3 2 5.6 2 8.8c0 1.8 1 3.4 2.5 4.5l-.6 2 2.2-1.1c.8.2 1.6.4 2.6.4h.5c-.1-.4-.2-.9-.2-1.4 0-3.1 2.9-5.6 6.4-5.6h.4C15.4 4.9 12.3 3 8.7 3zM6.5 6.9c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm4.6 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/><path d="M22 14.2c0-2.7-2.6-4.9-5.7-4.9s-5.7 2.2-5.7 4.9 2.6 4.9 5.7 4.9c.7 0 1.4-.1 2-.3l1.9.9-.5-1.7c1.4-.9 2.3-2.3 2.3-3.8zm-7.6-.8c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8zm3.8 0c-.4 0-.8-.3-.8-.8s.3-.8.8-.8.8.3.8.8-.4.8-.8.8z"/></svg>
          微信扫码登录
          <span class="tag-chip">二期</span>
        </button>
      </div>

      <p class="auth-alt">注册即代表同意 <a href="#" data-toast="用户协议（演示）" style="color:var(--accent)">用户协议</a> 与 <a href="#" data-toast="隐私政策（演示）" style="color:var(--accent)">隐私政策</a></p>
      <div class="demo-note">静态 UI 预览：一期为邮箱 + 密码（argon2id 哈希，JWT httpOnly Cookie 会话）；微信 OAuth 为二期。</div>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
